<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#137a52">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: data:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>Argus Local Core</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  </head>
  <body>
    <div id="app" class="app-shell">
      <main class="boot-panel">
        <p class="eyebrow">Argus v0.14.0</p>
        <h1>Starting local core</h1>
        <p>Loading your offline workspace.</p>
      </main>
    </div>
    <noscript>Argus needs JavaScript enabled to run the local app core.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
