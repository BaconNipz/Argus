name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "argus-v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ARGUS_KEYSTORE_BASE64 != '' && secrets.ARGUS_KEYSTORE_PASSWORD != '' && secrets.ARGUS_KEY_ALIAS != '' && secrets.ARGUS_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Argus web core
        run: node scripts/build.mjs

      - name: Sync web core into Android assets
        run: node scripts/sync-native-assets.mjs

      - name: Build debug APK
        run: gradle -p native-android assembleDebug

      - name: Prepare debug APK payload
        id: debug_payload
        shell: bash
        run: |
          version_name="$(node -p "JSON.parse(require('fs').readFileSync('public/update.json', 'utf8')).versionName")"
          mkdir -p dist/android
          apk_path="dist/android/Argus-v${version_name}-debug.apk"
          cp native-android/app/build/outputs/apk/debug/app-debug.apk "$apk_path"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/argus-v${version_name}/Argus-v${version_name}-debug.apk"
          node scripts/write-update-manifest.mjs "$apk_path" "$apk_url" dist/android/update.json
          {
            echo "version_name=${version_name}"
            echo "apk_path=${apk_path}"
            echo "manifest_path=dist/android/update.json"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          mkdir -p native-android/keystore
          printf '%s' "${{ secrets.ARGUS_KEYSTORE_BASE64 }}" | base64 --decode > native-android/keystore/argus-release.jks

      - name: Build signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ARGUS_KEYSTORE_FILE: ${{ github.workspace }}/native-android/keystore/argus-release.jks
          ARGUS_KEYSTORE_PASSWORD: ${{ secrets.ARGUS_KEYSTORE_PASSWORD }}
          ARGUS_KEY_ALIAS: ${{ secrets.ARGUS_KEY_ALIAS }}
          ARGUS_KEY_PASSWORD: ${{ secrets.ARGUS_KEY_PASSWORD }}
        run: gradle -p native-android assembleRelease

      - name: Prepare signed release APK update payload
        if: env.HAS_RELEASE_SIGNING == 'true'
        id: release_payload
        shell: bash
        run: |
          version_name="$(node -p "JSON.parse(require('fs').readFileSync('public/update.json', 'utf8')).versionName")"
          mkdir -p dist/android
          apk_path="dist/android/Argus-v${version_name}-release.apk"
          cp native-android/app/build/outputs/apk/release/app-release.apk "$apk_path"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/argus-v${version_name}/Argus-v${version_name}-release.apk"
          node scripts/write-update-manifest.mjs "$apk_path" "$apk_url" dist/android/release-update.json
          {
            echo "version_name=${version_name}"
            echo "apk_path=${apk_path}"
            echo "manifest_path=dist/android/release-update.json"
          } >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: argus-debug-apk
          path: ${{ steps.debug_payload.outputs.apk_path }}

      - name: Upload signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: argus-release-apk
          path: native-android/app/build/outputs/apk/release/*.apk

      - name: Publish signed release
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: argus-v${{ steps.release_payload.outputs.version_name }}
          name: Argus v${{ steps.release_payload.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Argus Android-first local-first signed release build.

            This APK uses the configured Argus release signing key. Future signed release builds can update over it as long as the package name, signing key and version-code sequence remain stable.
          files: |
            ${{ steps.release_payload.outputs.apk_path }}
            ${{ steps.release_payload.outputs.manifest_path }}

      - name: Publish debug fallback release
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: argus-v${{ steps.debug_payload.outputs.version_name }}
          name: Argus v${{ steps.debug_payload.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Argus Android-first local-first debug fallback build.

            This debug APK is installable for early testing but is not a reliable update chain. Configure release signing secrets to publish APKs that can update over future signed releases.
          files: |
            ${{ steps.debug_payload.outputs.apk_path }}
            ${{ steps.debug_payload.outputs.manifest_path }}
